
# Two-layer workforce scheduling architecture
#
# web-app   → Vite React frontend (compliance engine in-browser)
# optimizer → Python OR-Tools CP-SAT service (proposals only, never writes DB)
#
# Flow:  web-app → http://optimizer:5005/optimize → proposals
#                → compliance engine validates
#                → Supabase commit

services:
  optimizer:
    build:
      context: ./optimizer-service
      dockerfile: Dockerfile
    container_name: superman-optimizer
    ports:
      - '5005:8080'
    environment:
      - LOG_LEVEL=info
      # ── Phase 3 — production hardening ────────────────────────────────
      # Auth: dev-bypass keeps localhost workflows simple. In prod, set
      # SUPABASE_JWT_SECRET to the project's HS256 JWT secret and remove
      # OPTIMIZER_AUTH_DISABLED (or set it to false).
      - OPTIMIZER_AUTH_DISABLED=${OPTIMIZER_AUTH_DISABLED:-true}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE:-authenticated}
      # CORS allowlist — comma-separated origins. Default covers Vite
      # dev (5173) and the local web-app (8080).
      - OPTIMIZER_CORS_ORIGINS=${OPTIMIZER_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # Rate limits (per-IP). Bump under load test; tighten in prod.
      - OPTIMIZER_RATE_OPTIMIZE=${OPTIMIZER_RATE_OPTIMIZE:-30/minute}
      - OPTIMIZER_RATE_AUDIT=${OPTIMIZER_RATE_AUDIT:-60/minute}
      - OPTIMIZER_MAX_CONCURRENT_SOLVES=${OPTIMIZER_MAX_CONCURRENT_SOLVES:-2}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      # OpenTelemetry — set to a collector endpoint (e.g.
      # http://otel-collector:4317) to enable. Empty = no-op tracing.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-superman-optimizer}
    restart: unless-stopped
    healthcheck:
      # Liveness probe — `/health` is the cheap one. K8s should switch
      # to `/ready` for `readinessProbe` (also checks JWT + OR-Tools).
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: superman-ml
    ports:
      - '8000:8000'
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      # The browser ML client currently sends no bearer token, so local
      # Docker runs must explicitly opt into the development auth bypass.
      # Set this to false and configure ML_JWT_SECRET before exposing the
      # service outside localhost.
      - ML_AUTH_DISABLED=${ML_AUTH_DISABLED:-true}
      - ML_JWT_SECRET=${ML_JWT_SECRET:-}
      - ML_ALLOWED_ORIGINS=${ML_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
      - ML_VERIFY_MANIFEST_HASHES=${ML_VERIFY_MANIFEST_HASHES:-false}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      # Optional: needed only when committed forecasts must be persisted.
      # This server-side key is never passed to the Vite web image.
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  web-app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in .env}
        VITE_OPTIMIZER_URL: ${VITE_OPTIMIZER_URL:-http://localhost:5005}
        VITE_ML_URL: ${VITE_ML_URL:-http://localhost:8000}
        VITE_APNS_ENVIRONMENT: ${VITE_APNS_ENVIRONMENT:-development}
        VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-info}
        VITE_COMPLIANCE_BLOCKING_ENABLED: ${VITE_COMPLIANCE_BLOCKING_ENABLED:-true}
        VITE_COMPLIANCE_REJECTION_PERSIST: ${VITE_COMPLIANCE_REJECTION_PERSIST:-true}
        VITE_DEMAND_ENGINE_MODE: ${VITE_DEMAND_ENGINE_MODE:-ml_only}
        VITE_DEMAND_SERVICE_LEVEL: ${VITE_DEMAND_SERVICE_LEVEL:-0.5}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-docker-local}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE:-0}
        VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: ${VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE:-1.0}
    container_name: superman-web
    ports:
      - '8080:80'
    restart: unless-stopped
    depends_on:
      optimizer:
        condition: service_healthy
      ml:
        condition: service_healthy
